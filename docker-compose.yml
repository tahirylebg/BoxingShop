services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-boxingshop}
      POSTGRES_USER: ${POSTGRES_USER:-boxingshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boxingshop}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-boxingshop}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: boxingshop.settings.dev
      DATABASE_URL: postgres://${POSTGRES_USER:-boxingshop}:${POSTGRES_PASSWORD:-boxingshop}@db:5432/${POSTGRES_DB:-boxingshop}
    command: >
      sh -c "python manage.py migrate --noinput && python manage.py createcachetable &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
