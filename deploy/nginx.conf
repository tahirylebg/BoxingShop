# Exemple Nginx pour Boxing Shop (Gunicorn sur 127.0.0.1:8000). Adapter le domaine et les chemins.
upstream boxingshop { server 127.0.0.1:8000; }

server {
    listen 80;
    server_name boutique.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name boutique.example.com;

    ssl_certificate     /etc/letsencrypt/live/boutique.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boutique.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;     # téléversement d'images produits

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    # Pas de gzip sur le HTML : pages contenant un jeton CSRF (atténuation BREACH).

    # Images produits : noms versionnés par empreinte de contenu → cache d'un an
    location /media/products/webp/ {
        alias /srv/boxingshop/media/products/webp/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }
    location /media/invoices/ { deny all; }   # factures : uniquement via la vue authentifiée
    location /media/ {
        alias /srv/boxingshop/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_pass http://boxingshop;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
