<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Boxing Shop</title></head>
<body style="margin:0;background:#F4F3EF;color:#0D0D0D;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.5">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F4F3EF"><tr><td align="center" style="padding:24px 12px">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;border:2px solid #0D0D0D;background:#FBFAF7">
<tr><td style="background:#0D0D0D;color:#F4F3EF;padding:18px 24px;font-family:Impact,Arial Narrow,sans-serif;font-size:26px;text-transform:uppercase;letter-spacing:1px">Boxing Shop</td></tr>
<tr><td style="padding:24px">{% block body %}{% endblock %}</td></tr>
<tr><td style="border-top:1px solid #0D0D0D;padding:14px 24px;font-family:Courier New,monospace;font-size:11px;color:#4a4945">{{ SHOP.legal_name }} — {{ SHOP.address }} — {{ SHOP.email }}</td></tr>
</table></td></tr></table></body></html>
