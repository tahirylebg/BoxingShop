{% if form.non_field_errors %}<div class="span-2">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
  {% if field.field.widget.input_type == "checkbox" %}
    <div class="span-2"><label class="check">{{ field }}<span>{{ field.label }}</span></label>{{ field.errors }}</div>
  {% else %}
    <div class="field{% if wide %} span-2{% endif %}">
      <label for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %} <span class="muted">(facultatif)</span>{% endif %}</label>
      {{ field }}
      {% if field.help_text %}<p class="field-help">{{ field.help_text }}</p>{% endif %}
      {{ field.errors }}
    </div>
  {% endif %}
{% endfor %}
