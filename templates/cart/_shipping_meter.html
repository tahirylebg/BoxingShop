{% load shop %}{% if quote.remaining_for_free_shipping > 0 %}
  <div class="ship-meter">
    <p class="ship-meter__text"><svg class="ship-meter__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M2.5 6.5h11v9h-11zM13.5 9.5h4l3 3.2v2.8h-7"/><circle cx="6.5" cy="17" r="1.8"/><circle cx="17" cy="17" r="1.8"/></svg><span>Plus que <strong>{{ quote.remaining_for_free_shipping|money }}</strong> pour la livraison offerte</span></p>
    <progress class="ship-meter__bar" max="100" value="{{ quote.free_shipping_progress }}" aria-label="Progression vers la livraison offerte">{{ quote.free_shipping_progress }} %</progress>
  </div>
{% else %}
  <div class="ship-meter ship-meter--done">
    <p class="ship-meter__text"><svg class="ship-meter__icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 5" fill="none" stroke="currentColor" stroke-width="2"/></svg><span>Livraison offerte</span></p>
    <progress class="ship-meter__bar" max="100" value="100" aria-label="Livraison offerte atteinte">100 %</progress>
  </div>
{% endif %}
